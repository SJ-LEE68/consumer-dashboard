<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메트라이프생명 민원 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff; --surface:#fcfcfb; --line:#e7e6e2; --grid:#eeede9;
    --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8984;
    --s1:#2a78d6; --s2:#eb6834; --bad:#d03b3b; --good:#008300;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;line-height:1.5}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 48px}
  a.back{font-size:13px;color:var(--ink2);text-decoration:none}
  a.back:hover{text-decoration:underline}
  h1{font-size:24px;margin:10px 0 2px;letter-spacing:-.02em}
  .sub{color:var(--ink2);font-size:14px;margin:0 0 20px}
  #sample{display:none;background:var(--bad);color:#fff;text-align:center;padding:8px 12px;font-size:14px;font-weight:600}
  .cards{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card .k{font-size:13px;color:var(--ink2)}
  .card .v{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
  .card.big .v{font-size:40px}
  .card .v small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
  .card .d{font-size:13px;color:var(--ink2);margin-top:4px}
  .chg{font-weight:600}
  .chg.bad{color:var(--bad)} .chg.good{color:var(--good)}
  .grid{display:grid;grid-template-columns:1.25fr 1fr;gap:12px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative}
  .panel h2{font-size:15px;margin:0 0 2px}
  .panel .note{font-size:12px;color:var(--ink3);margin:0 0 8px}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
  svg{width:100%;height:auto;display:block;overflow:visible}
  svg text{font-family:inherit;font-variant-numeric:tabular-nums}
  .tip{position:absolute;pointer-events:none;background:#0b0b0b;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;line-height:1.55;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
  .tip b{font-weight:600}
  .summary{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
  details{margin-top:12px;font-size:13px;color:var(--ink2)}
  summary{cursor:pointer}
  table{border-collapse:collapse;width:100%;margin-top:8px;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
  th:first-child,td:first-child{text-align:left}
  th{font-weight:600;color:var(--ink)}
  footer{margin-top:20px;font-size:12px;color:var(--ink3)}
  #err{display:none;color:var(--bad);font-size:14px;margin:12px 0}
  @media (max-width:760px){
    .cards{grid-template-columns:1fr 1fr}
    .card.big,.card:nth-child(2){grid-column:1 / -1}
    .grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="sample">샘플 데이터입니다. 실제 공시 수치가 아닙니다.</div>
<div class="wrap">
  <a class="back" href="/">← 전체 목록</a>
  <h1>메트라이프생명 민원 현황</h1>
  <p class="sub">분기별 민원 건수와 보유계약 10만 건당 환산건수</p>
  <div id="err"></div>

  <div class="cards" id="cards"></div>

  <div class="grid">
    <div class="panel">
      <h2>분기별 민원 건수</h2>
      <p class="note">자체민원은 회사에 직접 접수된 민원, 대외민원은 금융감독원 등을 거쳐 접수된 민원</p>
      <div class="legend"><span><i style="background:var(--s1)"></i>자체민원</span><span><i style="background:var(--s2)"></i>대외민원</span></div>
      <svg id="bar" viewBox="0 0 560 300" role="img" aria-label="분기별 민원 건수 누적 막대그래프"></svg>
      <div class="tip" id="tipBar"></div>
    </div>
    <div class="panel">
      <h2>환산건수 추이</h2>
      <p class="note">보유계약 10만 건당 민원 건수. 회사 규모와 무관하게 비교할 수 있는 지표</p>
      <svg id="line" viewBox="0 0 440 300" role="img" aria-label="분기별 환산건수 선그래프"></svg>
      <div class="tip" id="tipLine"></div>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <details>
    <summary>표로 보기</summary>
    <table id="tbl"></table>
  </details>

  <footer id="foot"></footer>
</div>

<script>
  const URL_ = 'https://mfoixmokjzuzxdajitgk.supabase.co';
  const KEY  = 'sb_publishable_LZSmTipGhmxTAyE5Hbr_0w_L1gH8Mtw';
  const PAGE = 'complaint';
  // Supabase 표를 읽는 함수 (읽기 전용 공개 키 사용)
  const getRows = async (table, query) => {
    const res = await fetch(URL_ + '/rest/v1/' + table + '?' + query, { headers: { apikey: KEY } });
    if (!res.ok) throw new Error(table + ' 표를 읽지 못했습니다 (' + res.status + ')');
    return res.json();
  };

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    return e;
  };
  const fmt = n => Number(n).toLocaleString('ko-KR');
  const pct = (a, b) => b === 0 ? null : (a - b) / b * 100;
  // 민원은 줄어드는 것이 좋은 방향
  const chgHtml = (v, unit, digits = 1) => {
    if (v == null) return '';
    if (Math.abs(v) < 0.5 / Math.pow(10, digits)) return '<span class="chg">변동 없음</span>';
    const up = v > 0;
    return `<span class="chg ${up ? 'bad' : 'good'}">${up ? '▲ 증가' : '▼ 감소'} ${Math.abs(v).toFixed(digits)}${unit}</span>`;
  };
  // 위쪽 모서리만 둥근 막대
  const topRound = (x, y, w, h, r) => {
    r = Math.min(r, h, w / 2);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  };
  const niceMax = v => {
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const m = v / p;
    return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
  };
  function showTip(tip, panel, evt, html) {
    tip.innerHTML = html;
    const r = panel.getBoundingClientRect();
    let x = evt.clientX - r.left + 12, y = evt.clientY - r.top - 12;
    tip.style.opacity = 1;
    const w = tip.offsetWidth;
    if (x + w > r.width - 4) x = evt.clientX - r.left - w - 12;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  }

  function drawBar(rows) {
    const svg = document.getElementById('bar'), tip = document.getElementById('tipBar');
    const W = 560, H = 300, m = { l: 36, r: 8, t: 22, b: 30 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = niceMax(Math.max(...rows.map(r => r.total)) * 1.05);
    const y = v => m.t + ih - v / max * ih;
    for (let i = 0; i <= 4; i++) {
      const v = max / 4 * i;
      svg.append(el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: i ? 'var(--grid)' : 'var(--line)', 'stroke-width': 1 }));
      svg.append(el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--ink3)' }, fmt(v)));
    }
    const band = iw / rows.length, bw = Math.min(44, band * 0.56);
    rows.forEach((r, i) => {
      const x = m.l + band * i + (band - bw) / 2;
      const last = i === rows.length - 1;
      const op = last ? 1 : 0.5;
      const hOwn = r.own_count / max * ih, hExt = r.external_count / max * ih;
      const gap = hOwn > 0 && hExt > 0 ? 2 : 0;
      if (hOwn > 0) svg.append(el('rect', { x, y: y(r.own_count), width: bw, height: hOwn, fill: 'var(--s1)', opacity: op }));
      if (hExt > 0) svg.append(el('path', { d: topRound(x, y(r.total), bw, Math.max(hExt - gap, 1), 4), fill: 'var(--s2)', opacity: op }));
      svg.append(el('text', { x: x + bw / 2, y: y(r.total) - 6, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': last ? 700 : 500, fill: last ? 'var(--ink)' : 'var(--ink2)' }, fmt(r.total)));
      svg.append(el('text', { x: x + bw / 2, y: H - 10, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': last ? 700 : 400, fill: last ? 'var(--ink)' : 'var(--ink2)' }, r.quarter));
      const hit = el('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill: 'transparent' });
      const html = `<b>${r.quarter}</b><br>자체민원 ${fmt(r.own_count)}건<br>대외민원 ${fmt(r.external_count)}건<br>합계 ${fmt(r.total)}건`;
      hit.addEventListener('mousemove', e => showTip(tip, svg.parentNode, e, html));
      hit.addEventListener('mouseleave', () => tip.style.opacity = 0);
      svg.append(hit);
    });
  }

  function drawLine(rows) {
    const svg = document.getElementById('line'), tip = document.getElementById('tipLine');
    const W = 440, H = 300, m = { l: 30, r: 16, t: 22, b: 30 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = niceMax(Math.max(...rows.map(r => r.per_100k)) * 1.1);
    const y = v => m.t + ih - v / max * ih;
    const band = iw / rows.length, x = i => m.l + band * i + band / 2;
    for (let i = 0; i <= 4; i++) {
      const v = max / 4 * i;
      svg.append(el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: i ? 'var(--grid)' : 'var(--line)', 'stroke-width': 1 }));
      svg.append(el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--ink3)' }, v % 1 ? v.toFixed(1) : v));
    }
    svg.append(el('path', { d: rows.map((r, i) => (i ? 'L' : 'M') + x(i) + ',' + y(r.per_100k)).join(''), fill: 'none', stroke: 'var(--s1)', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    rows.forEach((r, i) => {
      const last = i === rows.length - 1;
      svg.append(el('circle', { cx: x(i), cy: y(r.per_100k), r: last ? 5 : 4, fill: 'var(--s1)', stroke: 'var(--surface)', 'stroke-width': 2 }));
      // 앞뒤보다 낮은 점은 선과 겹치지 않도록 값을 점 아래에 표시
      const p0 = rows[i - 1], p1 = rows[i + 1];
      const dip = p0 && r.per_100k < p0.per_100k && (!p1 || r.per_100k <= p1.per_100k);
      svg.append(el('text', { x: x(i), y: y(r.per_100k) + (dip ? 20 : -10), 'text-anchor': 'middle', 'font-size': 12, 'font-weight': last ? 700 : 500, fill: last ? 'var(--ink)' : 'var(--ink2)' }, r.per_100k.toFixed(2)));
      svg.append(el('text', { x: x(i), y: H - 10, 'text-anchor': 'middle', 'font-size': 11, 'font-weight': last ? 700 : 400, fill: last ? 'var(--ink)' : 'var(--ink2)' }, r.quarter));
      const hit = el('rect', { x: m.l + band * i, y: m.t, width: band, height: ih, fill: 'transparent' });
      const html = `<b>${r.quarter}</b><br>환산건수 ${r.per_100k.toFixed(2)}건<br>(보유계약 10만 건당)`;
      hit.addEventListener('mousemove', e => showTip(tip, svg.parentNode, e, html));
      hit.addEventListener('mouseleave', () => tip.style.opacity = 0);
      svg.append(hit);
    });
  }

  async function main() {
    const [qData, sData] = await Promise.all([
      getRows('complaint_quarterly', 'select=*&order=sort_order.asc'),
      getRows('data_source', 'select=*')
    ]);
    const q = { data: qData }, s = { data: sData };
    const rows = q.data.map(r => ({ ...r, per_100k: Number(r.per_100k), total: r.own_count + r.external_count }));
    if (!rows.length) throw new Error('complaint_quarterly 표에 데이터가 없습니다.');
    const cur = rows[rows.length - 1], prev = rows[rows.length - 2];

    if (s.data.some(r => r.is_sample)) document.getElementById('sample').style.display = 'block';
    const src = s.data.find(r => r.page === PAGE);
    if (src) document.getElementById('foot').textContent = `출처: ${src.source}, ${src.period}`;

    const dTotal = prev ? pct(cur.total, prev.total) : null;
    const dRate = prev ? cur.per_100k - prev.per_100k : null;
    const extShare = cur.external_count / cur.total * 100;
    document.getElementById('cards').innerHTML = `
      <div class="card big"><div class="k">${cur.quarter} 전체 민원</div>
        <div class="v">${fmt(cur.total)}<small>건</small></div>
        <div class="d">전분기 대비 ${chgHtml(dTotal, '%')}</div></div>
      <div class="card"><div class="k">환산건수 (10만 건당)</div>
        <div class="v">${cur.per_100k.toFixed(2)}<small>건</small></div>
        <div class="d">전분기 대비 ${chgHtml(dRate, '건', 2)}</div></div>
      <div class="card"><div class="k">자체민원</div>
        <div class="v">${fmt(cur.own_count)}<small>건</small></div>
        <div class="d">회사에 직접 접수</div></div>
      <div class="card"><div class="k">대외민원</div>
        <div class="v">${fmt(cur.external_count)}<small>건</small></div>
        <div class="d">전체의 ${extShare.toFixed(0)}%</div></div>`;

    drawBar(rows);
    drawLine(rows);

    const dir = dTotal == null ? '' : Math.abs(dTotal) < 0.05 ? '전분기와 같고' : `전분기보다 ${Math.abs(dTotal).toFixed(1)}% ${dTotal > 0 ? '늘었고' : '줄었고'}`;
    document.getElementById('summary').textContent =
      `${cur.quarter} 민원은 ${fmt(cur.total)}건으로 ${dir}, 대외민원 비중은 ${extShare.toFixed(0)}%입니다.`;

    document.getElementById('tbl').innerHTML =
      '<tr><th>분기</th><th>자체민원</th><th>대외민원</th><th>합계</th><th>환산건수</th></tr>' +
      rows.map(r => `<tr><td>${r.quarter}</td><td>${fmt(r.own_count)}</td><td>${fmt(r.external_count)}</td><td>${fmt(r.total)}</td><td>${r.per_100k.toFixed(2)}</td></tr>`).join('');
  }

  main().catch(e => {
    const box = document.getElementById('err');
    box.style.display = 'block';
    box.textContent = '데이터를 불러오지 못했습니다: ' + (e.message || e);
    console.error(e);
  });
</script>
</body>
</html>
